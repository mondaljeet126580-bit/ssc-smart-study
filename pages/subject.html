<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC Smart Study</title>

<link rel="stylesheet" href="../css/main.css">

</head>

<body>

<header class="top-header">

<h1 id="title">Loading...</h1>

<p>Select Category</p>

</header>

<div class="container">

<div class="menu-grid" id="grid">

</div>

</div>

<nav class="bottom-nav">

<button onclick="location.href='study.html'">

📚<br>Study

</button>

<button onclick="location.href='../index.html'">

🏠<br>Home

</button>

</nav>

<script>

const params = new URLSearchParams(window.location.search);

const subject = params.get("name");

document.getElementById("title").innerText = subject;

const folderMap = {

"General Knowledge":"general-knowledge",

"General Science":"general-science",

"Mathematics":"mathematics",

"Reasoning":"reasoning",

"Current Affairs":"current-affairs",

"Previous Year":"previous-year"

};

const folder = folderMap[subject];

if(folder){

fetch("../data/"+folder+"/subjects.json")

.then(res=>res.json())

.then(data=>{

const grid=document.getElementById("grid");

grid.innerHTML="";

data.forEach(item=>{

grid.innerHTML += `

<div class="card"

onclick="openChapter('${item.folder}','${item.name}')">

<div class="icon">${item.icon}</div>

<h3>${item.name}</h3>

</div>

`;

});

})

.catch(()=>{

document.getElementById("grid").innerHTML=

"<h3>No data found.</h3>";

});

}

function openChapter(folder,name){

window.location.href=

"chapter.html?subject="+

encodeURIComponent(subject)+

"&folder="+

encodeURIComponent(folder)+

"&chapter="+

encodeURIComponent(name);

}

</script>

</body>

</html>
