<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Smart Study</title>

<link rel="stylesheet" href="../css/main.css">

</head>

<body>

<header class="top-header">

<h1 id="chapterTitle">Chapter</h1>

<p>Select an Option</p>

</header>

<div class="container">

<div class="menu-grid">

<div class="card" onclick="openPage('notes.html')">

<div class="icon">📖</div>

<h3>Notes</h3>

<p>Study Notes</p>

</div>

<div class="card" onclick="openPage('mcq.html')">

<div class="icon">📝</div>

<h3>MCQ Practice</h3>

<p>Practice Questions</p>

</div>

<div class="card" onclick="openPage('previous-year.html')">

<div class="icon">📄</div>

<h3>Previous Year</h3>

<p>SSC PYQ</p>

</div>

<div class="card" onclick="openPage('mock-test.html')">

<div class="icon">🎯</div>

<h3>Mock Test</h3>

<p>Chapter Test</p>

</div>

</div>

</div>

<nav class="bottom-nav">

<button onclick="history.back()">
⬅️<br>Back
</button>

<button onclick="location.href='../index.html'">
🏠<br>Home
</button>

</nav>

<script>

const params = new URLSearchParams(window.location.search);

const subject = params.get("subject");

const chapter = params.get("chapter");

if(chapter){

document.getElementById("chapterTitle").innerText = chapter;

}

function openPage(page){

window.location.href =
page +
"?subject=" +
encodeURIComponent(subject) +
"&chapter=" +
encodeURIComponent(chapter);

}

</script>

</body>

</html>
