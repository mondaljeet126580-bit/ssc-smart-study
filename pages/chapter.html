<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Smart Study</title>

<link rel="stylesheet" href="../css/main.css">

</head>

<body>

<header class="top-header">

<h1 id="title">Chapters</h1>

<p>Select Chapter</p>

</header>

<div class="container">

<div class="menu-grid" id="chapterGrid">

</div>

</div>

<nav class="bottom-nav">

<button onclick="history.back()">
⬅️<br>Back
</button>

<button onclick="location.href='../index.html'">
🏠<br>Home
</button>

</nav>

<script>

const params=new URLSearchParams(window.location.search);

const subject=params.get("subject");

const folder=params.get("folder");

const chapter=params.get("chapter");

document.getElementById("title").innerText=chapter;

fetch("../data/general-science/"+folder+"/chapters.json")

.then(r=>r.json())

.then(data=>{

const grid=document.getElementById("chapterGrid");

grid.innerHTML="";

data.forEach(item=>{

grid.innerHTML+=`

<div class="card"
onclick="openNotes('${item.folder}','${item.name}')">

<div class="icon">📚</div>

<h3>${item.name}</h3>

</div>

`;

});

})

.catch(()=>{

document.getElementById("chapterGrid").innerHTML=

"<h3>No Chapters Found</h3>";

});

function openNotes(folder,name){

window.location.href=

"notes.html?chapter="+

encodeURIComponent(name);

}

</script>

</body>

</html>
