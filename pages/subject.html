<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC Smart Study</title>

<link rel="stylesheet" href="../css/main.css">

</head>

<body>

<header class="top-header">

<h1 id="subjectTitle">Subject</h1>

<p>Select a Category</p>

</header>

<div class="container">

<div class="menu-grid" id="menuGrid">

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const subject = params.get("name");

document.getElementById("subjectTitle").textContent = subject;

const menuGrid = document.getElementById("menuGrid");

let items = [];

switch(subject){

case "General Science":

items=[

"Physics",

"Chemistry",

"Biology"

];

break;

case "General Knowledge":

items=[

"Ancient History",

"Medieval History",

"Modern History",

"Indian Polity",

"Indian Economy",

"Indian Geography"

];

break;

case "Mathematics":

items=[];

break;

case "Reasoning":

items=[];

break;

case "English":

items=[];

break;

case "Current Affairs":

items=[];

break;

case "Previous Year":

items=[];

break;

default:

items=[];

}

items.forEach(item=>{

menuGrid.innerHTML+=`

<div class="card">

<div class="icon">📚</div>

<h3>${item}</h3>

</div>

`;

});

</script>

</body>

</html>
