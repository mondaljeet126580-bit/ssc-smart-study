<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1722"><title>SSC Smart Study — Login</title>
<style>
:root{--bg:#07131e;--card:#102130;--line:#244057;--text:#edf6ff;--muted:#9bb0c2;--green:#13b985;--danger:#ff6b7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#17354a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif;padding:18px}.card{width:min(440px,100%);background:#0e1d2b;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 60px #0007}.logo{width:62px;height:62px;margin:0 auto 14px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#13b985,#176dc0);font-size:25px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#091723;border-radius:12px;padding:4px;margin:18px 0}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:750;cursor:pointer}.tabs button.active{background:#153b36;color:#9ff6d8}.field{width:100%;padding:12px 13px;margin-top:7px;background:#091723;color:var(--text);border:1px solid var(--line);border-radius:11px;outline:none}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px #13b98520}label{display:block;margin-top:13px;font-size:12px;color:var(--muted)}.pin{letter-spacing:7px;font-weight:800}.btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:17px;background:var(--green);color:#052218;font-weight:850;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.msg{margin-top:14px;padding:11px 12px;border-radius:11px;font-size:12px;background:#162b3c;color:#cce7f8}.msg.error{background:#3d2029;color:#ffd0d6;border:1px solid #733642}.msg.ok{background:#10382e;color:#b5f8df;border:1px solid #246e5a}.small{text-align:center;color:var(--muted);font-size:11px;margin-top:15px}.hidden{display:none!important}.maintenanceScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at top,#6b4a22 0,transparent 40%),#07131e}.maintenanceScreen.hidden{display:none!important}.maintenanceCard{width:min(460px,100%);padding:28px 22px;text-align:center;border:1px solid #4b4537;border-radius:22px;background:linear-gradient(145deg,#172a3b,#0d1a27);box-shadow:0 18px 50px #0007}.maintenanceIcon{width:78px;height:78px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#3a3020;color:#ffd782;font-size:40px}.maintenanceCard h1{margin:0 0 12px;font-size:32px}.maintenanceCard p{margin:0;color:#b4c5d2;font-size:15px;white-space:pre-wrap}.maintenanceCard small{display:block;margin-top:23px;color:#7f96a8;font-size:11px}.account{display:none;text-align:center}.account h2{margin:0 0 5px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#d9f7ea;color:#116348;margin:0 auto 12px;font-weight:900;font-size:21px}.logout{background:#182b3a;color:var(--text)}
</style>
</head>
<body>
<div id="maintenanceScreen" class="maintenanceScreen hidden" aria-live="polite"><section class="maintenanceCard"><div class="maintenanceIcon">🛠️</div><h1>on maintenance</h1><p id="maintenanceMessage">অ্যাপটি সাময়িকভাবে বন্ধ আছে।</p><small>SSC Smart Study • কিছুক্ষণ পরে আবার চেষ্টা করো</small></section></div>
<div class="card" id="loginCard">
  <div class="logo">S</div>
  <h2 style="text-align:center;margin:0">SSC Smart Study</h2>
  <p style="text-align:center;color:var(--muted);margin:4px 0">Username + 6-digit PIN দিয়ে নিরাপদ লগইন</p>
  <div id="authBox">
    <div class="tabs"><button id="loginTab" class="active">লগইন</button><button id="signupTab">নতুন অ্যাকাউন্ট</button></div>
    <form id="form">
      <div id="nameWrap" class="hidden"><label>তোমার নাম<input id="displayName" class="field" maxlength="60" autocomplete="name" placeholder="যেমন: Jeet Mondal"></label></div>
      <label>Username<input id="username" class="field" maxlength="24" autocomplete="username" autocapitalize="none" placeholder="যেমন: jeet123"></label>
      <label>6-digit PIN<input id="pin" class="field pin" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"></label>
      <button id="submit" class="btn">লগইন</button>
    </form>
    <div id="msg" class="msg hidden"></div>
    <div class="small">PIN ভুলে গেলে নতুন অ্যাকাউন্ট দিয়ে একই username ব্যবহার করা যাবে না। তাই PIN নিরাপদে মনে রাখো।</div>
  </div>
  <div id="account" class="account">
    <div id="avatar" class="avatar">S</div><h2 id="hello"></h2><p style="color:var(--muted)">তুমি সফলভাবে লগইন করেছো।</p>
    <button id="openApp" class="btn">Study App খুলুন</button><button id="logout" class="btn logout">লগআউট</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script>
<script>
(()=>{
'use strict';
const URL='https://mtitrkspgoqaqdeiluud.supabase.co',KEY='sb_publishable_MNm-dTK29hrtVkiyLRkLIw_qbtbxJu_',AUTH=URL+'/functions/v1/user-auth';
const supa=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let mode='login';
function message(t,err=false){$('msg').textContent=t;$('msg').className='msg '+(err?'error':'ok');}
async function checkMaintenance(){try{const {data,error}=await supa.rpc('get_app_maintenance');if(error)throw error;const state=data||{enabled:false,message:'on maintenance'};if(state.enabled){$('maintenanceMessage').textContent=state.message||'on maintenance';$('maintenanceScreen').classList.remove('hidden');$('loginCard').classList.add('hidden');return true}$('maintenanceScreen').classList.add('hidden');$('loginCard').classList.remove('hidden');return false}catch(e){console.warn('maintenance check failed',e.message||e);return false}}
function validUser(u){return /^[a-z0-9._-]{3,24}$/.test(u)}
function switchMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameWrap').classList.toggle('hidden',m!=='signup');$('submit').textContent=m==='signup'?'অ্যাকাউন্ট তৈরি করুন':'লগইন';$('msg').className='msg hidden';$('pin').value=''}
$('loginTab').onclick=()=>switchMode('login');$('signupTab').onclick=()=>switchMode('signup');
$('username').addEventListener('input',e=>e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9._-]/g,''));$('pin').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));
async function showSession(session){if(await checkMaintenance())return;if(!session){$('authBox').style.display='block';$('account').style.display='none';return}const {data:p,error}=await supa.from('profiles').select('username,display_name,is_banned').eq('id',session.user.id).maybeSingle();if(error||!p||p.is_banned){await supa.auth.signOut();message(p?.is_banned?'এই অ্যাকাউন্টটি ব্যান করা হয়েছে।':'প্রোফাইল পাওয়া যায়নি।',true);$('authBox').style.display='block';$('account').style.display='none';return}$('authBox').style.display='none';$('account').style.display='block';$('hello').textContent='স্বাগতম, '+(p.display_name||p.username);$('avatar').textContent=(p.display_name||p.username).charAt(0).toUpperCase();}
$('form').onsubmit=async e=>{e.preventDefault();if(await checkMaintenance())return;const u=$('username').value.trim().toLowerCase(),pin=$('pin').value;if(!validUser(u)||!/^[0-9]{6}$/.test(pin)){message('Username 3–24 অক্ষরের এবং PIN ঠিক 6 সংখ্যার হতে হবে।',true);return}$('submit').disabled=true;try{if(mode==='signup'){const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'signup',username:u,pin,display_name:$('displayName').value.trim()})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Account তৈরি করা যায়নি');message('অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করো।');switchMode('login');$('username').value=u}else{const email=u.replace(/[^a-z0-9._-]/g,'-')+'@username.ssc-smart-study.local';const {data,error}=await supa.auth.signInWithPassword({email,password:pin});if(error)throw new Error('Username অথবা PIN ভুল।');await showSession(data.session)}}catch(err){message(err.message||'কিছু একটা সমস্যা হয়েছে।',true)}finally{$('submit').disabled=false}};
supa.auth.onAuthStateChange((_e,s)=>{if(s)showSession(s)});(async()=>{if(await checkMaintenance())return;supa.auth.getSession().then(({data})=>showSession(data.session));})();setInterval(()=>{void checkMaintenance().then(on=>{if(on){$('loginCard').classList.add('hidden');$('account').style.display='none'}})},15000);
$('logout').onclick=async()=>{await supa.auth.signOut();$('account').style.display='none';$('authBox').style.display='block';switchMode('login')};
$('openApp').onclick=()=>{window.location.href='index.html'};
})();
</script>
</body></html>
