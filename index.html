<!DOCTYPE html>
<html lang="en">
<head>

</head>

      📚
      <h3>Subjects</h3>
    </div>

    <div class="card">

    <div class="card">
      📊

    </div>

<nav class="bottom-nav">

  <button>🏠<br>Home</button>

  <button>📚<br>Subjects</button>

  <button>📝<br>Practice</button>
