<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC Smart Study</title>

<link rel="stylesheet" href="../css/main.css">

</head>

<body>

<header class="top-header">

<h1 id="pageTitle">Subject</h1>

<p>Select a Category</p>

</header>

<div class="container">

<div class="menu-grid" id="menuGrid">

</div>

</div>

<nav class="bottom-nav">

<button onclick="location.href='../index.html'">
🏠<br>Home
</button>

<button onclick="location.href='study.html'">
📚<br>Study
</button>

</nav>

<script>

const params = new URLSearchParams(window.location.search);

const subject = params.get("name");

document.getElementById("pageTitle").innerText = subject;

const menuGrid = document.getElementById("menuGrid");

let list = [];

switch(subject){

case "General Science":

list = [

"Physics",

"Chemistry",

"Biology"

];

break;

case "General Knowledge":

list = [

"History",

"Geography",

"Polity",

"Economy",

"Art & Culture"

];

break;

case "Mathematics":

list = [

"Arithmetic",

"Algebra",

"Geometry",

"Trigonometry"

];

break;

case "Reasoning":

list = [

"Verbal",

"Non Verbal",

"Puzzle",

"Series"

];

break;

case "Current Affairs":

list = [

"Daily",

"Weekly",

"Monthly"

];

break;

case "Previous Year":

list = [

"SSC CGL",

"SSC CHSL",

"SSC MTS",

"SSC GD"

];

break;

default:

list=[];

}

list.forEach(item=>{

menuGrid.innerHTML +=

`

<div class="card"

onclick="openChapter('${item}')">

<div class="icon">📂</div>

<h3>${item}</h3>

<p>Open</p>

</div>

`;

});

function openChapter(chapter){

window.location.href=

"chapter.html?subject="+

encodeURIComponent(subject)+

"&chapter="+

encodeURIComponent(chapter);

}

</script>

</body>

</html>
